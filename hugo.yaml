              - 建立 Prometheus/Grafana 可觀測性監控機制，並開發 .NET 監控服務與告警規則，提升事件偵測能力並縮短問題發現時間（MTTD）
              - 主導年度弱點掃描與第三方元件漏洞修補計畫，協調開發、維運與資安單位完成整改，降低潛在資安風險
              - 推動小額支付黑名單管理等多項關鍵功能/CR 順利上線，確保交付品質、系統穩定度與合規性
