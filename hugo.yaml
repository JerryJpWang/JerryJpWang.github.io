  # About
  about:
    enable: true
    title: "關於我"
    image: "/images/me.jpg"
    content: |-
      我是王敬平（Jerry），一位由軟體工程師轉型的 Technical Program Manager，具備 11+ 年橫跨軟體開發、系統整合與技術交付的經驗。

      近年專注於 Technical Program / Project Management，主導跨部門、跨系統的技術專案規劃、執行與落地，範疇涵蓋 FinTech / 支付、信用卡授權平台、Azure 雲端、DevOps / CI-CD、系統可觀測性、資安治理與 FinOps 成本優化。擅長管理 roadmap、風險、相依性與 change / release 流程，並協調工程、產品、業務、維運等利害關係人共同完成交付。

      曾主導第三方支付整合、CI/CD 自動化、Prometheus / Grafana 監控治理、Azure FinOps 成本優化與資安修補計畫，持續提升交易成功率、部署效率、系統穩定性與成本效益。

      具備 PMP、PMI-ACP、LPIC Level 1 認證，兼具技術深度與 program delivery 能力。
    skills:
      enable: true
      title: "近期專注的領域："
      items:
        - "Technical Program Management"
        - "Azure 雲端架構"
        - "DevOps / CI-CD"
        - "可觀測性（Prometheus / Grafana）"
        - "FinTech 與支付整合"
        - "C# / .NET"
        - "FinOps 成本優化"
        - "PMP / PMI-ACP"

