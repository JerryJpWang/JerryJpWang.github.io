baseURL: "https://jerryjpwang.github.io/"
locale: "en-us"
title: "Uncle Jerry"
theme: hugo-profile

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    label: "English"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: blog
          name: Blog
          title: Blog posts
          url: /blogs
          weight: 1

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Uncle Jerry"
  description: "Uncle Jerry's personal site"
  favicon: "/fav.png"

  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    brandName: "Uncle Jerry"
    disableSearch: false
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Uncle Jerry."
    subtitle: "Technical Program Manager & Software Engineer"
    content: "11+ years building and delivering software across FinTech, payments, and enterprise systems. Today I focus on Technical Program / Project Management — driving cross-team roadmaps, Azure DevOps/CI-CD, observability, and security initiatives from planning through production."
    image: /images/hero.jpg
    bottomImage:
      enable: true
    button:
      enable: false
      name: "Resume"
      url: "#"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/JerryJpWang

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I'm a software engineer turned technical program manager with 11+ years of experience spanning software development, systems integration, and technical delivery.

      In recent years I've focused on Technical Program / Project Management, driving cross-department, cross-system technical initiatives from planning through execution and production rollout. My domain experience covers FinTech and payments, credit card authorization platforms, Azure cloud, DevOps/CI-CD, observability, security governance, and FinOps cost optimization — managing roadmaps, risk, dependencies, and change/release processes while aligning engineering, product, business, and operations stakeholders.

      I've led third-party payment integrations, CI/CD automation, Prometheus/Grafana observability rollouts, Azure FinOps cost optimization, and security remediation programs — consistently improving transaction success rates, deployment efficiency, system stability, and cost efficiency.

      I hold PMP, PMI-ACP, and LPIC Level 1 certifications, combining technical depth with program delivery capability.
    skills:
      enable: true
      title: "Here are a few areas I've been working in recently:"
      items:
        - "Technical Program Management"
        - "Azure Cloud"
        - "DevOps / CI-CD"
        - "Observability (Prometheus / Grafana)"
        - "FinTech & Payments"
        - "C# / .NET"
        - "FinOps"
        - "PMP / PMI-ACP"

  # Experience
  experience:
    enable: false

  # Education
  education:
    enable: false

  # Achievements
  achievements:
    enable: false

  # projects
  projects:
    enable: false

  #Contact
  contact:
    enable: true
    content: "My inbox is always open. Whether you have a question or just want to say hi, I'll try my best to get back to you!"
    btnName: Mail me
    btnLink: mailto:example@example.com

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/JerryJpWang

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
