baseURL: "https://jerryjpwang.github.io/"
locale: "en-us"
title: "Uncle Jerry"
theme: hugo-profile

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    label: "English"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: blog
          name: Blog
          title: Blog posts
          url: /blogs
          weight: 1

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Uncle Jerry"
  description: "Uncle Jerry's personal site"
  favicon: "/fav.png"

  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    brandName: "Uncle Jerry"
    disableSearch: false
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Uncle Jerry."
    subtitle: "I build things for the web"
    content: "A passionate developer. Update this section with your own introduction."
    image: /images/hero.svg
    bottomImage:
      enable: true
    button:
      enable: false
      name: "Resume"
      url: "#"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/JerryJpWang

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      Write a short introduction about yourself here.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "HTML"
        - "CSS"
        - "JavaScript"

  # Experience
  experience:
    enable: false

  # Education
  education:
    enable: false

  # Achievements
  achievements:
    enable: false

  # projects
  projects:
    enable: false

  #Contact
  contact:
    enable: true
    content: "My inbox is always open. Whether you have a question or just want to say hi, I'll try my best to get back to you!"
    btnName: Mail me
    btnLink: mailto:example@example.com

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/JerryJpWang

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
